version: '3.9'\n\nservices:\n  # PostgreSQL Database\n  postgres:\n    image: postgres:15-alpine\n    container_name: yolo_postgres\n    environment:\n      POSTGRES_USER: yolo_user\n      POSTGRES_PASSWORD: yolo_password\n      POSTGRES_DB: yolo_detection\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n    ports:\n      - \"5432:5432\"\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U yolo_user\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    networks:\n      - yolo_network\n\n  # Redis Cache\n  redis:\n    image: redis:7-alpine\n    container_name: yolo_redis\n    ports:\n      - \"6379:6379\"\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    networks:\n      - yolo_network\n\n  # FastAPI Backend\n  backend:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile\n    container_name: yolo_backend\n    environment:\n      DATABASE_URL: postgresql://yolo_user:yolo_password@postgres:5432/yolo_detection\n      REDIS_URL: redis://redis:6379/0\n      PYTHONUNBUFFERED: 1\n      ENV: development\n    ports:\n      - \"8000:8000\"\n    volumes:\n      - ./backend:/app\n      - ./backend/runs:/app/runs\n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload\n    networks:\n      - yolo_network\n\n  # React Frontend\n  frontend:\n    build:\n      context: ./frontend\n      dockerfile: Dockerfile\n    container_name: yolo_frontend\n    ports:\n      - \"3000:5173\"\n    volumes:\n      - ./frontend/src:/app/src\n      - ./frontend/public:/app/public\n    environment:\n      VITE_API_URL: http://localhost:8000\n    depends_on:\n      - backend\n    command: npm run dev\n    networks:\n      - yolo_network\n\nvolumes:\n  postgres_data:\n\nnetworks:\n  yolo_network:\n    driver: bridge\n